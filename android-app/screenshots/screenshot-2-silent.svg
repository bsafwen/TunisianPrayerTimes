  <text x="240" y="797" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">20 د</text>
  <line x1="80" y1="820" x2="1000" y2="820" stroke="#E8DFD0" stroke-width="0.5"/>

  <text x="960" y="867" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الظهر</text>
  <text x="720" y="867" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2C2C2C">12:45</text>
  <rect x="430" y="842" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="480" y="869" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">0 د</text>
  <rect x="190" y="842" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="240" y="869" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">30 د</text>
  <line x1="80" y1="892" x2="1000" y2="892" stroke="#E8DFD0" stroke-width="0.5"/>

  <text x="960" y="939" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العصر</text>
  <text x="720" y="939" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2C2C2C">16:20</text>
  <rect x="430" y="914" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="480" y="941" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">0 د</text>
  <rect x="190" y="914" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="240" y="941" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">20 د</text>
  <line x1="80" y1="964" x2="1000" y2="964" stroke="#E8DFD0" stroke-width="0.5"/>

  <text x="960" y="1011" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">المغرب</text>
  <text x="720" y="1011" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2C2C2C">19:30</text>
  <rect x="430" y="986" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="480" y="1013" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">0 د</text>
  <rect x="190" y="986" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="240" y="1013" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">20 د</text>
  <line x1="80" y1="1036" x2="1000" y2="1036" stroke="#E8DFD0" stroke-width="0.5"/>

  <text x="960" y="1083" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العشاء</text>
  <text x="720" y="1083" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2C2C2C">21:00</text>
  <rect x="430" y="1058" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="480" y="1085" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">0 د</text>
  <rect x="190" y="1058" width="100" height="40" rx="8" fill="#FFF8F0" stroke="#E8DFD0" stroke-width="1"/>
  <text x="240" y="1085" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2C2C2C">30 د</text>

  <!-- Auto-silence toggle ON -->
  <rect x="40" y="1282" width="1000" height="80" rx="16" fill="#FFFFFF" stroke="#F5E6C8" stroke-width="1"/>
  <text x="960" y="1332" text-anchor="end" font-family="sans-serif" font-size="24" fill="#004D40">الإسكات التلقائي أثناء الصلاة</text>
  <rect x="80" y="1305" width="56" height="30" rx="15" fill="#00695C"/>
  <circle cx="121" cy="1320" r="12" fill="#FFFFFF"/>

  <!-- Unsilence button (red) -->
  <rect x="40" y="1400" width="1000" height="80" rx="16" fill="#C62828"/>
  <text x="540" y="1450" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">إلغاء الصامت 🔔</text>
