<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Onboarding welcome screen -->
  <rect width="1080" height="1920" fill="#FFF8F0"/>
  <rect width="1080" height="48" fill="#004D40"/>

  <!-- Progress bars -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="160" height="6" rx="3" fill="#D4AF37"/>
    <rect x="170" y="0" width="160" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="340" y="0" width="160" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="510" y="0" width="160" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="680" y="0" width="160" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="850" y="0" width="160" height="6" rx="3" fill="#F5E6C8"/>
  </g>

  <!-- Large Bismillah -->
  <text x="540" y="280" text-anchor="middle" font-family="serif" font-size="96" fill="#D4AF37">﷽</text>

  <!-- Large mosque icon -->
  <g transform="translate(370, 340) scale(3.2)">
    <path fill="#004D40" d="M40,72 Q40,38 54,30 Q68,38 68,72 Z"/>
    <path fill="#D4AF37" d="M54,20 A8,8 0 1,0 54,36 A6,6 0 1,1 54,20Z"/>
    <path fill="#D4AF37" d="M66,24 L67.5,28 L72,28 L68.5,30.5 L69.5,34.5 L66,32 L62.5,34.5 L63.5,30.5 L60,28 L64.5,28 Z"/>
    <path fill="#004D40" fill-opacity="0.7" d="M30,72 L30,48 Q30,42 33,42 Q36,42 36,48 L36,72 Z"/>
    <path fill="#004D40" fill-opacity="0.7" d="M72,72 L72,48 Q72,42 75,42 Q78,42 78,48 L78,72 Z"/>
  </g>

  <!-- App name -->
  <text x="540" y="650" text-anchor="middle" font-family="sans-serif" font-size="48" fill="#004D40" font-weight="bold">أوقات الصلاة تونس</text>

  <!-- Welcome message -->
  <text x="540" y="780" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#2C2C2C" direction="rtl">هذا التطبيق يقوم بإسكات هاتفك</text>
  <text x="540" y="825" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#2C2C2C" direction="rtl">تلقائيًا عند دخول وقت كل صلاة.</text>
  <text x="540" y="900" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#2C2C2C" direction="rtl">دعنا نشرح لك كيف يعمل</text>

  <!-- Decorative divider -->
  <line x1="400" y1="960" x2="680" y2="960" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>

  <!-- Feature highlights -->
  <g transform="translate(0, 1020)">
    <text x="540" y="0" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C">🕌 مواقيت دقيقة من الرصد الجوي</text>
    <text x="540" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C">🔇 إسكات تلقائي أثناء الصلاة</text>
    <text x="540" y="120" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C">⚙️ تخصيص لكل صلاة</text>
    <text x="540" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C">🌙 دعم شهر رمضان</text>
  </g>

  <!-- Navigation -->
  <rect x="40" y="1760" width="1000" height="70" rx="16" fill="#00695C"/>
  <text x="540" y="1805" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">التالي</text>
</svg>
