<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="2048" viewBox="0 0 1152 2048">
  <!-- Full settings view - tablet -->
  <rect width="1152" height="2048" fill="#FFF8F0"/>

  <!-- Status bar -->
  <rect width="1152" height="48" fill="#004D40"/>

  <!-- Header -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
  </defs>
  <rect y="48" width="1152" height="300" fill="url(#hg)"/>

  <!-- Bismillah -->
  <text x="576" y="130" text-anchor="middle" font-family="serif" font-size="56" fill="#D4AF37">﷽</text>
  <text x="576" y="195" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold">مواقيت الصلاة في تونس</text>
  <text x="576" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#F5E6C8">📍 صفاقس</text>
  <text x="576" y="280" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E0D4C0">2025/07/05 - ٩ ذو الحجة ١٤٤٦</text>
  <line x1="300" y1="310" x2="852" y2="310" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>

  <!-- Status card -->
  <rect x="100" y="380" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="576" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#004D40" font-weight="bold">🔇 الهاتف في الوضع الصامت — العصر</text>

  <!-- Prayer table -->
  <rect x="100" y="490" width="952" height="60" rx="12" fill="#004D40"/>
  <text x="170" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4AF37" font-weight="bold">المدة</text>
  <text x="320" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4AF37" font-weight="bold">الإقامة</text>
  <text x="500" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4AF37" font-weight="bold">الأذان</text>
  <text x="690" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4AF37" font-weight="bold">الإسكات</text>
  <text x="900" y="528" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4AF37" font-weight="bold">الصلاة</text>

  <!-- Fajr -->
  <rect x="100" y="555" width="952" height="70" fill="#FFFFFF" stroke="#F0EAE0" stroke-width="1"/>
  <text x="170" y="598" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">30 د</text>
  <text x="320" y="598" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">04:45</text>
  <text x="500" y="598" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">04:25</text>
  <text x="690" y="598" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="598" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الفجر</text>

  <!-- Dhuhr -->
  <rect x="100" y="625" width="952" height="70" fill="#FDF8F0" stroke="#F0EAE0" stroke-width="1"/>
  <text x="170" y="668" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">25 د</text>
  <text x="320" y="668" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">12:55</text>
  <text x="500" y="668" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">12:37</text>
  <text x="690" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="668" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الظهر</text>

  <!-- Asr - highlighted -->
  <rect x="100" y="695" width="952" height="70" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="170" y="738" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">25 د</text>
  <text x="320" y="738" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">16:30</text>
  <text x="500" y="738" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">16:10</text>
  <text x="690" y="738" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="738" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">▶ العصر</text>

  <!-- Maghrib -->
  <rect x="100" y="765" width="952" height="70" fill="#FFFFFF" stroke="#F0EAE0" stroke-width="1"/>
  <text x="170" y="808" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">20 د</text>
  <text x="320" y="808" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">19:55</text>
  <text x="500" y="808" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">19:40</text>
  <text x="690" y="808" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="808" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">المغرب</text>

  <!-- Isha -->
  <rect x="100" y="835" width="952" height="70" fill="#FDF8F0" stroke="#F0EAE0" stroke-width="1"/>
  <text x="170" y="878" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">30 د</text>
  <text x="320" y="878" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">21:30</text>
  <text x="500" y="878" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">21:05</text>
  <text x="690" y="878" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="878" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العشاء</text>

  <!-- Separator -->
  <line x1="140" y1="945" x2="1012" y2="945" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

  <!-- Settings section -->
  <text x="1012" y="1000" text-anchor="end" font-family="sans-serif" font-size="28" fill="#004D40" font-weight="bold">⚙️ إعدادات الإسكات</text>

  <!-- Global toggle -->
  <rect x="100" y="1030" width="952" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="140" y="1050" width="56" height="36" rx="18" fill="#00695C"/>
  <circle cx="176" cy="1068" r="14" fill="#FFFFFF"/>
  <text x="1012" y="1078" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">الإسكات التلقائي</text>

  <!-- Silent duration -->
  <rect x="100" y="1125" width="952" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="140" y="1173" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">30 دقيقة</text>
  <text x="1012" y="1173" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">مدة الإسكات الافتراضية</text>

  <!-- Ramadan mode -->
  <rect x="100" y="1220" width="952" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="140" y="1240" width="56" height="36" rx="18" fill="#CCC"/>
  <circle cx="158" cy="1258" r="14" fill="#FFFFFF"/>
  <text x="1012" y="1268" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">🌙 وضع رمضان</text>

  <!-- Iqama setting -->
  <rect x="100" y="1315" width="952" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="140" y="1335" width="56" height="36" rx="18" fill="#00695C"/>
  <circle cx="176" cy="1353" r="14" fill="#FFFFFF"/>
  <text x="1012" y="1363" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">الإسكات عند الإقامة</text>

  <!-- Action button -->
  <rect x="100" y="1445" width="952" height="76" rx="16" fill="#D32F2F"/>
  <text x="576" y="1493" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">🔔 إلغاء الصامت</text>

  <!-- Bottom note -->
  <text x="576" y="1580" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">بيانات الصلاة من الديوان الوطني للرصد الجوي</text>
  <text x="576" y="1615" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">التطبيق لا يحتاج إلى الأنترنت</text>
</svg>
