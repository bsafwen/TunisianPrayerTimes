name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Android artifacts (runs once on ubuntu) ──
  android:
    name: Android (APK + AAB)
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=../release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease -q

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab

  # ── Desktop artifacts (matrix: macOS, Windows, Linux) ──
  desktop:
    name: Desktop (${{ matrix.os }})
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            task: packageReleaseDmg
            glob: "multiplatform/desktopApp/build/compose/binaries/main-release/dmg/*.dmg"
            artifact: desktop-dmg
          - os: Windows
            runner: windows-latest
            task: packageReleaseMsi
            glob: "multiplatform/desktopApp/build/compose/binaries/main-release/msi/*.msi"
            artifact: desktop-msi
          - os: Linux
            runner: ubuntu-latest
            task: packageReleaseDeb
            glob: "multiplatform/desktopApp/build/compose/binaries/main-release/deb/*.deb"
            artifact: desktop-deb
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG=$(echo "${{ github.event.head_commit.message }}" | grep -oE '^v[0-9]+\.[0-9]+')
          VER="${TAG#v}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Build native installer
        run: ./gradlew :desktopApp:${{ matrix.task }} "-PappVersion=${{ steps.version.outputs.ver }}"

      - name: Build uber JAR (Linux only)
        if: matrix.os == 'Linux'
        run: ./gradlew :desktopApp:packageReleaseUberJarForCurrentOS "-PappVersion=${{ steps.version.outputs.ver }}"

      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}

      - name: Upload uber JAR
        if: matrix.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: multiplatform/desktopApp/build/compose/jars/*.jar

  # ── GitHub Release (collects all artifacts) ──
  publish:
    name: Publish GitHub Release
    if: startsWith(github.event.head_commit.message, 'v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          TAG=$(echo "${{ github.event.head_commit.message }}" | grep -oE '^v[0-9]+\.[0-9]+')
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release
          cp artifacts/android-apk/*.apk     "release/TunisianPrayerTimes-${TAG}.apk"
          cp artifacts/desktop-jar/*.jar     "release/TunisianPrayerTimes-${TAG}-desktop.jar"
          cp artifacts/desktop-dmg/*.dmg     "release/TunisianPrayerTimes-${TAG}.dmg"     || true
          cp artifacts/desktop-msi/*.msi     "release/TunisianPrayerTimes-${TAG}.msi"     || true
          cp artifacts/desktop-deb/*.deb     "release/TunisianPrayerTimes-${TAG}.deb"     || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Tunisian Prayer Times ${{ steps.version.outputs.ver }}"
          body: |
            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Android | `.apk` | Install directly on your device |
            | Windows | `.msi` | Windows installer |
            | macOS | `.dmg` | macOS disk image |
            | Linux | `.deb` | Debian/Ubuntu package |
            | All desktops | `.jar` | Cross-platform, requires Java 17+ |
          files: release/*
