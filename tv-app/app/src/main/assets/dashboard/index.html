<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EFECE4">
<title>إدارة شاشة المسجد</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="who">
    <div id="mosque-name" class="mosque-name">شاشة المسجد</div>
    <div class="link-line">
      <span id="link" class="link"><span class="dot" aria-hidden="true"></span><span id="link-text">جارٍ الاتصال…</span></span>
      <span id="mosque-place"></span>
    </div>
  </div>
  <div id="clock" class="clock digits" dir="ltr"></div>
</header>
<nav id="tabs" class="tabs" aria-label="الأقسام"></nav>
<div id="notice" class="notice" role="status" hidden></div>
<main id="view" class="view">
  <p class="muted">جارٍ التحميل…</p>
</main>
<div id="toast" class="toast" role="status"></div>
<dialog id="preview" class="dialog" aria-labelledby="preview-title">
  <h2 id="preview-title">ما سيتغيّر على الشاشة</h2>
  <ul id="preview-lines" class="lines"></ul>
  <div class="row">
    <button id="preview-apply" type="button" class="primary">تطبيق</button>
    <button id="preview-cancel" type="button">إلغاء</button>
  </div>
</dialog>
<script src="app.js"></script>
<script src="formula.js"></script>
<script src="views/overview.js"></script>
<!-- The tabs follow this order: the most used first. -->
<script src="views/prayers.js"></script>
<script src="views/adhkar.js"></script>
<script src="views/announcements.js"></script>
<script src="views/mosque.js"></script>
<script src="views/formula.js"></script>
<script src="views/dates.js"></script>
<script src="views/advanced.js"></script>
<script>Dashboard.start();</script>
</body>
</html>
