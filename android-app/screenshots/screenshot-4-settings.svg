<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Prayer settings screen -->
  <rect width="1080" height="1920" fill="#FFF8F0"/>

  <!-- Status bar -->
  <rect width="1080" height="48" fill="#004D40"/>

  <!-- Header -->
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
  </defs>
  <rect y="48" width="1080" height="280" fill="url(#headerGrad)"/>

  <!-- Bismillah -->
  <text x="540" y="120" text-anchor="middle" font-family="serif" font-size="52" fill="#D4AF37">﷽</text>

  <!-- App Title -->
  <text x="540" y="185" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">مواقيت الصلاة في تونس</text>

  <!-- Location -->
  <text x="540" y="230" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#F5E6C8">📍 صفاقس</text>

  <!-- Date -->
  <text x="540" y="270" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E0D4C0">2025/07/05 - ٩ ذو الحجة ١٤٤٦</text>

  <!-- Decorative line -->
  <line x1="200" y1="295" x2="880" y2="295" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>

  <!-- Status card -->
  <rect x="60" y="355" width="960" height="80" rx="16" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="540" y="407" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">🔇 الهاتف في الوضع الصامت — العصر</text>

  <!-- Prayer table header -->
  <rect x="60" y="465" width="960" height="60" rx="12" fill="#004D40"/>
  <text x="160" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">المدة</text>
  <text x="350" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">الإقامة</text>
  <text x="540" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">الأذان</text>
  <text x="720" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">الإسكات</text>
  <text x="900" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#D4AF37" font-weight="bold">الصلاة</text>

  <!-- Fajr row -->
  <rect x="60" y="530" width="960" height="75" rx="0" fill="#FFFFFF" stroke="#F0EAE0" stroke-width="1"/>
  <text x="160" y="577" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">30 د</text>
  <text x="350" y="577" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">04:45</text>
  <text x="540" y="577" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">04:25</text>
  <text x="720" y="577" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="577" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الفجر</text>

  <!-- Dhuhr row -->
  <rect x="60" y="605" width="960" height="75" rx="0" fill="#FDF8F0" stroke="#F0EAE0" stroke-width="1"/>
  <text x="160" y="652" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">25 د</text>
  <text x="350" y="652" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">12:55</text>
  <text x="540" y="652" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">12:37</text>
  <text x="720" y="652" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="652" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الظهر</text>

  <!-- Asr row - highlighted as active -->
  <rect x="60" y="680" width="960" height="75" rx="0" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="160" y="727" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">25 د</text>
  <text x="350" y="727" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">16:30</text>
  <text x="540" y="727" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">16:10</text>
  <text x="720" y="727" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="727" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">▶ العصر</text>

  <!-- Maghrib row -->
  <rect x="60" y="755" width="960" height="75" rx="0" fill="#FFFFFF" stroke="#F0EAE0" stroke-width="1"/>
  <text x="160" y="802" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">20 د</text>
  <text x="350" y="802" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">19:55</text>
  <text x="540" y="802" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">19:40</text>
  <text x="720" y="802" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="802" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">المغرب</text>

  <!-- Isha row -->
  <rect x="60" y="830" width="960" height="75" rx="0" fill="#FDF8F0" stroke="#F0EAE0" stroke-width="1"/>
  <text x="160" y="877" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666">30 د</text>
  <text x="350" y="877" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">21:30</text>
  <text x="540" y="877" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333">21:05</text>
  <text x="720" y="877" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">✓</text>
  <text x="900" y="877" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العشاء</text>

  <!-- Separator -->
  <line x1="100" y1="940" x2="980" y2="940" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

  <!-- Settings section -->
  <text x="960" y="990" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">⚙️ إعدادات الإسكات</text>

  <!-- Settings cards -->
  <!-- Global toggle -->
  <rect x="60" y="1020" width="960" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="100" y="1040" width="60" height="36" rx="18" fill="#00695C"/>
  <circle cx="140" cy="1058" r="14" fill="#FFFFFF"/>
  <text x="960" y="1068" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">الإسكات التلقائي</text>

  <!-- Silent duration -->
  <rect x="60" y="1115" width="960" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="100" y="1163" font-family="sans-serif" font-size="22" fill="#00695C" font-weight="bold">30 دقيقة</text>
  <text x="960" y="1163" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">مدة الإسكات الافتراضية</text>

  <!-- Ramadan mode -->
  <rect x="60" y="1210" width="960" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="100" y="1230" width="60" height="36" rx="18" fill="#CCC"/>
  <circle cx="120" cy="1248" r="14" fill="#FFFFFF"/>
  <text x="960" y="1258" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">🌙 وضع رمضان</text>

  <!-- Iqama setting -->
  <rect x="60" y="1305" width="960" height="80" rx="14" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="100" y="1325" width="60" height="36" rx="18" fill="#00695C"/>
  <circle cx="140" cy="1343" r="14" fill="#FFFFFF"/>
  <text x="960" y="1353" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">الإسكات عند الإقامة</text>

  <!-- Action button -->
  <rect x="60" y="1440" width="960" height="70" rx="16" fill="#D32F2F"/>
  <text x="540" y="1485" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold">🔔 إلغاء الصامت</text>

  <!-- Bottom note -->
  <text x="540" y="1570" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">بيانات الصلاة من الديوان الوطني للرصد الجوي</text>
  <text x="540" y="1605" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">التطبيق لا يحتاج إلى الأنترنت</text>
</svg>
