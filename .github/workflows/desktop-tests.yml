name: Desktop Tests

on:
  push:
    branches: [main]
    paths:
      - "multiplatform/**"
      - "test-data/islamic-calendar/**"
      - "test-data/inm-prayer-times/**"
      - "test-data/engine-reference/**"
      - "data/prayer-formula/**"
      - "docs/csv/**"
      - "scripts/prayer_formula/**"
      - "tv-app/app/src/main/assets/dashboard/formula.js"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "multiplatform/**"
      - "test-data/islamic-calendar/**"
      - "test-data/inm-prayer-times/**"
      - "test-data/engine-reference/**"
      - "data/prayer-formula/**"
      - "docs/csv/**"
      - "scripts/prayer_formula/**"
      - "tv-app/app/src/main/assets/dashboard/formula.js"
      - ".github/workflows/desktop-tests.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Shared & Desktop Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared tests (commonTest on JVM)
        run: ./gradlew :shared:javaTest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the INM reference against the published tables
        working-directory: .
        run: python scripts/prayer_formula/inm_prayer_times.py --verify

      - name: Check the TV dashboard's formula
        working-directory: .
        run: node scripts/prayer_formula/check_dashboard_formula.js

      - name: Check the shared engine's independent reference
        working-directory: .
        run: python -m unittest scripts/prayer_formula/test_prayer_engine_reference.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-results
          path: multiplatform/shared/build/reports/tests/
