name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/official-islamic-dates/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data/official-islamic-dates
          cp -a docs/. _site/
          cp -a data/official-islamic-dates/. _site/data/official-islamic-dates/

          shopt -s nullglob
          for path in data/official-islamic-dates/*.json; do
            year="$(basename "$path" .json)"
            cp "$path" "_site/ramadan-override-${year}.json"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5