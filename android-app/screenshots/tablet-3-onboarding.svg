<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="2048" viewBox="0 0 1152 2048">
  <!-- Onboarding welcome screen - tablet -->
  <rect width="1152" height="2048" fill="#FFF8F0"/>
  <rect width="1152" height="48" fill="#004D40"/>

  <!-- Progress bars -->
  <g transform="translate(56, 80)">
    <rect x="0" y="0" width="166" height="6" rx="3" fill="#D4AF37"/>
    <rect x="176" y="0" width="166" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="352" y="0" width="166" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="528" y="0" width="166" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="704" y="0" width="166" height="6" rx="3" fill="#F5E6C8"/>
    <rect x="880" y="0" width="166" height="6" rx="3" fill="#F5E6C8"/>
  </g>

  <!-- Large Bismillah -->
  <text x="576" y="300" text-anchor="middle" font-family="serif" font-size="108" fill="#D4AF37">﷽</text>

  <!-- Large mosque icon -->
  <g transform="translate(380, 370) scale(3.8)">
    <path fill="#004D40" d="M40,72 Q40,38 54,30 Q68,38 68,72 Z"/>
    <path fill="#D4AF37" d="M54,20 A8,8 0 1,0 54,36 A6,6 0 1,1 54,20Z"/>
    <path fill="#D4AF37" d="M66,24 L67.5,28 L72,28 L68.5,30.5 L69.5,34.5 L66,32 L62.5,34.5 L63.5,30.5 L60,28 L64.5,28 Z"/>
    <path fill="#004D40" fill-opacity="0.7" d="M30,72 L30,48 Q30,42 33,42 Q36,42 36,48 L36,72 Z"/>
    <path fill="#004D40" fill-opacity="0.7" d="M72,72 L72,48 Q72,42 75,42 Q78,42 78,48 L78,72 Z"/>
  </g>

  <!-- App name -->
  <text x="576" y="720" text-anchor="middle" font-family="sans-serif" font-size="54" fill="#004D40" font-weight="bold">أوقات الصلاة تونس</text>

  <!-- Welcome message -->
  <text x="576" y="860" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#2C2C2C" direction="rtl">هذا التطبيق يقوم بإسكات هاتفك</text>
  <text x="576" y="910" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#2C2C2C" direction="rtl">تلقائيًا عند دخول وقت كل صلاة.</text>
  <text x="576" y="1000" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#2C2C2C" direction="rtl">دعنا نشرح لك كيف يعمل</text>

  <!-- Decorative divider -->
  <line x1="400" y1="1070" x2="752" y2="1070" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>

  <!-- Feature highlights -->
  <g transform="translate(0, 1130)">
    <text x="576" y="0" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#00695C">🕌 مواقيت دقيقة من الرصد الجوي</text>
    <text x="576" y="70" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#00695C">🔇 إسكات تلقائي أثناء الصلاة</text>
    <text x="576" y="140" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#00695C">⚙️ تخصيص لكل صلاة</text>
    <text x="576" y="210" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#00695C">🌙 دعم شهر رمضان</text>
  </g>

  <!-- Navigation button -->
  <rect x="100" y="1880" width="952" height="76" rx="16" fill="#00695C"/>
  <text x="576" y="1928" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#FFFFFF" font-weight="bold">التالي</text>
</svg>
