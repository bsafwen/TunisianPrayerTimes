name: Islamic Date Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/*lunar*.py"
      - "scripts/prepare_islamic_date_pr.py"
      - "test-data/islamic-calendar/**"
      - "data/official-islamic-dates/**"
      - ".github/workflows/check-islamic-dates.yml"
      - ".github/workflows/islamic-date-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/*lunar*.py"
      - "scripts/prepare_islamic_date_pr.py"
      - "test-data/islamic-calendar/**"
      - "data/official-islamic-dates/**"
      - ".github/workflows/check-islamic-dates.yml"
      - ".github/workflows/islamic-date-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run publisher, evidence, merge and app contract tests
        run: python -B -m unittest discover -s scripts -p 'test_lunar*.py'
