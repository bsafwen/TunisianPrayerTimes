name: Desktop Tests

on:
  push:
    branches: [main]
    paths:
      - "multiplatform/**"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "multiplatform/**"
      - ".github/workflows/desktop-tests.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Shared & Desktop Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared tests (commonTest on JVM)
        run: ./gradlew :shared:javaTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-results
          path: multiplatform/shared/build/reports/tests/
