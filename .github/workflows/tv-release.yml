name: TV Release

# Builds the signed TV app for Google Play (AAB) and for sideloading on boxes without Play (APK).
# Run by hand from the Actions tab; nothing is uploaded to Play: the AAB is attached to the run for
# a person to upload in the Play Console.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Version code, higher than every upload before (Play refuses a repeat)"
        required: true
      versionName:
        description: "Version name shown to admins, for example 1.0"
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tv-release
  cancel-in-progress: false

jobs:
  release:
    name: Signed AAB + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app

    steps:
      - uses: actions/checkout@v6

      # tv-app/gradle/gradle-daemon-jvm.properties asks for a JDK 21 daemon.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Check the version inputs
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "versionCode must be a positive whole number"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z.\-]{1,20}$ ]] || { echo "versionName must look like 1.0"; exit 1; }

      # The same upload key as the phone app (repository secrets); never written to the log.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=../release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties points at a developer's SDK; CI uses ANDROID_HOME instead.
      - name: Remove local SDK path
        run: rm -f local.properties

      - name: Test, then build the release
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease
          "-PtvVersionCode=$VERSION_CODE" "-PtvVersionName=$VERSION_NAME"

      - name: Remove signing files
        if: always()
        run: rm -f release-keystore.jks keystore.properties

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v6
        with:
          name: tv-aab-${{ inputs.versionName }}
          path: tv-app/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (boxes without Play)
        uses: actions/upload-artifact@v6
        with:
          name: tv-apk-${{ inputs.versionName }}
          path: tv-app/app/build/outputs/apk/release/app-release.apk
