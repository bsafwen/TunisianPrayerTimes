<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Same main screen but in silent mode -->
  <rect width="1080" height="1920" fill="#FFF8F0"/>
  <rect width="1080" height="48" fill="#004D40"/>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
  </defs>
  <rect y="48" width="1080" height="340" fill="url(#hdr)"/>
  <text x="540" y="130" text-anchor="middle" font-family="serif" font-size="56" fill="#D4AF37">﷽</text>
  <g transform="translate(460, 140) scale(1.8)">
    <path fill="#FFFFFF" fill-opacity="0.9" d="M40,72 Q40,38 54,30 Q68,38 68,72 Z"/>
    <path fill="#D4AF37" d="M54,20 A8,8 0 1,0 54,36 A6,6 0 1,1 54,20Z"/>
    <path fill="#D4AF37" d="M66,24 L67.5,28 L72,28 L68.5,30.5 L69.5,34.5 L66,32 L62.5,34.5 L63.5,30.5 L60,28 L64.5,28 Z"/>
    <path fill="#FFFFFF" fill-opacity="0.7" d="M30,72 L30,48 Q30,42 33,42 Q36,42 36,48 L36,72 Z"/>
    <path fill="#FFFFFF" fill-opacity="0.7" d="M72,72 L72,48 Q72,42 75,42 Q78,42 78,48 L78,72 Z"/>
  </g>
  <text x="540" y="340" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">مواقيت الصلاة في تونس</text>
  <text x="540" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#D4AF37" opacity="0.8">المعهد الوطني للرصد الجوي</text>
  <rect y="388" width="1080" height="6" fill="#D4AF37" opacity="0.4"/>

  <!-- Status card - SILENT MODE -->
  <rect x="40" y="420" width="1000" height="80" rx="16" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
  <text x="540" y="472" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#C62828" direction="rtl" font-weight="bold">الهاتف في الوضع الصامت 🔇</text>

  <!-- Location picker -->
  <rect x="40" y="524" width="1000" height="90" rx="16" fill="#FFFFFF" stroke="#F5E6C8" stroke-width="1"/>
  <text x="980" y="560" text-anchor="end" font-family="sans-serif" font-size="20" fill="#6D6D6D">المعتمدية</text>
  <text x="980" y="595" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">صفاقس</text>

  <!-- Prayer settings card -->
  <rect x="40" y="638" width="1000" height="620" rx="16" fill="#FFFFFF" stroke="#F5E6C8" stroke-width="1"/>
  <text x="980" y="685" text-anchor="end" font-family="sans-serif" font-size="24" fill="#004D40" font-weight="bold">إعدادات الإسكات</text>
  <text x="960" y="730" text-anchor="end" font-family="sans-serif" font-size="18" fill="#6D6D6D">الصلاة</text>
  <text x="720" y="730" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#6D6D6D">الوقت</text>
  <text x="480" y="730" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#6D6D6D">التأخير</text>
  <text x="240" y="730" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#6D6D6D">المدة</text>
  <line x1="80" y1="748" x2="1000" y2="748" stroke="#E8DFD0" stroke-width="1"/>

