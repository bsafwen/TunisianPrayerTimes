<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="2048" viewBox="0 0 1152 2048">
  <!-- Silent mode - tablet -->
  <rect width="1152" height="2048" fill="#FFF8F0"/>

  <!-- Status bar -->
  <rect width="1152" height="48" fill="#004D40"/>

  <!-- Header -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
  </defs>
  <rect y="48" width="1152" height="320" fill="url(#hg)"/>

  <!-- Bismillah -->
  <text x="576" y="140" text-anchor="middle" font-family="serif" font-size="60" fill="#D4AF37">﷽</text>

  <!-- Mosque icon -->
  <g transform="translate(510, 155) scale(1.2)">
    <path fill="#FFFFFF" d="M40,72 Q40,38 54,30 Q68,38 68,72 Z"/>
    <path fill="#D4AF37" d="M54,20 A8,8 0 1,0 54,36 A6,6 0 1,1 54,20Z"/>
    <path fill="#D4AF37" d="M66,24 L67.5,28 L72,28 L68.5,30.5 L69.5,34.5 L66,32 L62.5,34.5 L63.5,30.5 L60,28 L64.5,28 Z"/>
    <path fill="#FFFFFF" fill-opacity="0.6" d="M30,72 L30,48 Q30,42 33,42 Q36,42 36,48 L36,72 Z"/>
    <path fill="#FFFFFF" fill-opacity="0.6" d="M72,72 L72,48 Q72,42 75,42 Q78,42 78,48 L78,72 Z"/>
  </g>

  <!-- App title -->
  <text x="576" y="290" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#FFFFFF" font-weight="bold">مواقيت الصلاة في تونس</text>
  <text x="576" y="330" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#E0D4C0">المعهد الوطني للرصد الجوي</text>

  <line x1="300" y1="348" x2="852" y2="348" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>

  <!-- Status card - SILENT MODE -->
  <rect x="100" y="400" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
  <text x="576" y="450" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#D32F2F" font-weight="bold">🔇 الهاتف في الوضع الصامت</text>

  <!-- Location card -->
  <rect x="100" y="505" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="952" y="540" text-anchor="end" font-family="sans-serif" font-size="20" fill="#888">المعتمدية</text>
  <text x="952" y="570" text-anchor="end" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">صفاقس</text>

  <!-- Prayer settings card -->
  <rect x="100" y="610" width="952" height="660" rx="16" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <text x="952" y="660" text-anchor="end" font-family="sans-serif" font-size="26" fill="#00695C" font-weight="bold">إعدادات الإسكات</text>

  <!-- Table header -->
  <text x="200" y="720" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">المدة</text>
  <text x="380" y="720" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">التأخير</text>
  <text x="576" y="720" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">الوقت</text>
  <text x="850" y="720" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">الصلاة</text>
  <line x1="140" y1="740" x2="1012" y2="740" stroke="#F0EAE0" stroke-width="1"/>

  <!-- Fajr - highlighted as active -->
  <rect x="130" y="745" width="892" height="70" rx="8" fill="#FFF3E0"/>
  <rect x="140" y="750" width="180" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="230" y="780" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 20</text>
  <rect x="310" y="750" width="140" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="380" y="780" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 0</text>
  <text x="576" y="780" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">05:15</text>
  <text x="850" y="780" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">◀ الفجر</text>
  <line x1="140" y1="820" x2="1012" y2="820" stroke="#F0EAE0" stroke-width="1"/>

  <!-- Dhuhr -->
  <rect x="140" y="830" width="180" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="230" y="860" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 30</text>
  <rect x="310" y="830" width="140" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="380" y="860" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 0</text>
  <text x="576" y="860" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">12:45</text>
  <text x="850" y="860" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">الظهر</text>
  <line x1="140" y1="890" x2="1012" y2="890" stroke="#F0EAE0" stroke-width="1"/>

  <!-- Asr -->
  <rect x="140" y="900" width="180" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="230" y="930" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 20</text>
  <rect x="310" y="900" width="140" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="380" y="930" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 0</text>
  <text x="576" y="930" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">16:20</text>
  <text x="850" y="930" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العصر</text>
  <line x1="140" y1="960" x2="1012" y2="960" stroke="#F0EAE0" stroke-width="1"/>

  <!-- Maghrib -->
  <rect x="140" y="975" width="180" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="230" y="1005" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 20</text>
  <rect x="310" y="975" width="140" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="380" y="1005" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 0</text>
  <text x="576" y="1005" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">19:30</text>
  <text x="850" y="1005" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">المغرب</text>
  <line x1="140" y1="1035" x2="1012" y2="1035" stroke="#F0EAE0" stroke-width="1"/>

  <!-- Isha -->
  <rect x="140" y="1050" width="180" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="230" y="1080" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 30</text>
  <rect x="310" y="1050" width="140" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="380" y="1080" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">د 0</text>
  <text x="576" y="1080" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333">21:00</text>
  <text x="850" y="1080" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#004D40" font-weight="bold">العشاء</text>

  <!-- Auto-silence toggle -->
  <rect x="100" y="1300" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#E0D4C0" stroke-width="1"/>
  <rect x="140" y="1322" width="56" height="32" rx="16" fill="#00695C"/>
  <circle cx="176" cy="1338" r="12" fill="#FFFFFF"/>
  <text x="952" y="1348" text-anchor="end" font-family="sans-serif" font-size="24" fill="#333">الإسكات التلقائي أثناء الصلاة</text>

  <!-- Action button - RED for cancel -->
  <rect x="100" y="1420" width="952" height="76" rx="16" fill="#D32F2F"/>
  <text x="576" y="1468" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">🔔 إلغاء الصامت</text>
</svg>
